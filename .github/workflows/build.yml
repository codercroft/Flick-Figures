name: Build

# Every push to main builds an Android APK and a web build, and publishes both on the
# "Latest build" release page. You can also run it by hand from the Actions tab.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  GODOT_VERSION: 4.3.0

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: false
          include-templates: true

      - name: Tell Godot where the Android SDK, Java and debug key are
        run: |
          mkdir -p ~/.config/godot build
          cat > ~/.config/godot/editor_settings-4.3.tres <<SETTINGS
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_SDK_ROOT"
          export/android/java_sdk_path = "$JAVA_HOME_17_X64"
          export/android/debug_keystore = "$GITHUB_WORKSPACE/signing/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          SETTINGS

      - name: Give this build a new version code (so it installs over the last one)
        run: sed -i "s/^version\/code=.*/version\/code=${{ github.run_number }}/" export_presets.cfg

      - name: Import project
        run: godot --headless --import || true

      - name: Export APK
        run: godot --headless --export-debug "Android" build/FlickFigures.apk

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: build/FlickFigures.apk

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: false
          include-templates: true

      - name: Import project
        run: godot --headless --import || true

      - name: Export web build
        run: |
          mkdir -p build/web
          godot --headless --export-release "Web" build/web/index.html
          cd build/web && zip -r ../flick-figures-web.zip .

      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: build/flick-figures-web.zip

  release:
    needs: [android, web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish the "Latest build" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" || true
          gh release create latest dist/FlickFigures.apk dist/flick-figures-web.zip \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "Latest build" \
            --notes "Build ${{ github.run_number }} from commit ${GITHUB_SHA::7}. Install FlickFigures.apk on an Android phone."
