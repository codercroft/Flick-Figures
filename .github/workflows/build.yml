name: Build

# Every push to main builds an Android APK and a web build, publishes both on the "Latest build"
# release page, and deploys the web build to GitHub Pages (the stable link for iPhone players).
# You can also run it by hand from the Actions tab.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  GODOT_VERSION: 4.3.0

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: false
          include-templates: true

      - name: Make sure the Android SDK pieces Godot 4.3 wants are installed
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_SDK_ROOT" \
            "platform-tools" "build-tools;34.0.0" "platforms;android-34" "cmdline-tools;latest" > /dev/null || true
          echo "SDK: $ANDROID_SDK_ROOT"; ls "$ANDROID_SDK_ROOT" "$ANDROID_SDK_ROOT/build-tools" "$ANDROID_SDK_ROOT/platforms"
          echo "JAVA17: $JAVA_HOME_17_X64"; ls "$JAVA_HOME_17_X64/bin" | head -3

      - name: Tell Godot where the Android SDK, Java and debug key are
        run: |
          mkdir -p ~/.config/godot build
          cat > ~/.config/godot/editor_settings-4.3.tres <<SETTINGS
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_SDK_ROOT"
          export/android/java_sdk_path = "$JAVA_HOME_17_X64"
          export/android/debug_keystore = "$GITHUB_WORKSPACE/signing/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          SETTINGS

      - name: Give this build a new version code (so it installs over the last one)
        run: sed -i "s/^version\/code=.*/version\/code=${{ github.run_number }}/" export_presets.cfg

      - name: Import project
        run: godot --headless --import || true

      - name: Smoke test the exported game (catches export-only failures, like an empty shop)
        run: |
          godot --headless --export-pack "Web" build/smoke.pck
          # Run from the build folder: next to project.godot Godot would use the project files, not the pack.
          cd build
          godot --headless --main-pack smoke.pck -s ../tools/smoke_test.gd

      - name: Export APK
        run: godot --headless --verbose --export-debug "Android" build/FlickFigures.apk

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: build/FlickFigures.apk

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: false
          include-templates: true

      - name: Import project
        run: godot --headless --import || true

      - name: Export web build
        run: |
          mkdir -p build/web
          godot --headless --export-release "Web" build/web/index.html

      - name: Prepare the web build for Pages (icons, manifest, cache-busting, version check)
        run: |
          cd build/web
          V=${{ github.run_number }}
          # Every file gets this build's number in its name, so a new deploy is never served from an old cache.
          for f in index.*; do
            [ "$f" = "index.html" ] && continue
            mv "$f" "index-$V.${f#index.}"
          done
          sed -i -E "s/\"executable\":\"index\"/\"executable\":\"index-$V\"/; s/index\.(js|wasm|pck|png|audio\.worklet\.js|audio\.position\.worklet\.js)/index-$V.\1/g; s/__BUILD__/$V/g" index.html
          cp ../../web/manifest.webmanifest ../../web/icon-192.png ../../web/icon-512.png \
            ../../web/icon-maskable-512.png ../../web/apple-touch-icon.png .
          # version.json is what an open or cached page compares itself with.
          echo "{\"build\": \"$V\", \"commit\": \"${GITHUB_SHA::7}\"}" > version.json
          touch .nojekyll
          grep -c "index-$V" index.html
          ls -la
          zip -r ../flick-figures-web.zip .

      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: build/flick-figures-web.zip

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  pages:
    # Needs "Settings > Pages > Source: GitHub Actions" turned on once (see README).
    needs: [web]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  release:
    needs: [android, web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish the "Latest build" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" || true
          gh release create latest dist/FlickFigures.apk dist/flick-figures-web.zip \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "Latest build" \
            --notes "Build ${{ github.run_number }} from commit ${GITHUB_SHA::7}. Install FlickFigures.apk on an Android phone."
